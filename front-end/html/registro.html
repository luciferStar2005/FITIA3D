<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front-end/css/registroStyle.css">
    <title>Document</title>
</head>
<body>
   <div class="registro-container">
    <p class="registro-tag">COMIENZA HOY</p>
    <h1 class="registro-title">ACCESO ANTICIPADO</h1>
    <p class="registro-subtitle">Únete a la lista de espera para ser de los primeros en entrenar con IA.</p>

    <form class="registro-form">
        <div class="input-group">
            <input type="text" placeholder="NOMBRE " required>
        </div>
        <div class="input-group">
            <input type="text" placeholder="APELLIDO" required>
        </div>
        <div class="input-group">
            <input type="number" placeholder="EDAD" required>
        </div>
        <div class="input-group">
            <input type="number" placeholder="PESO" required>
        </div>
        <div class="input-group">
            <input type="number" placeholder="ESTATURA(CM)" required>
        </div>
        <div class="input-group">
            <input type="email" placeholder="CORREO ELECTRÓNICO" required>
        </div>
        <div class="input-group">
            <input type="password" placeholder="CONTRASEÑA" required>
        </div>
        <button type="submit" class="btn-submit">ENVIAR SOLICITUD</button>
    </form>
    
    <p class="registro-footer">SIN TARJETA · SIN DESCARGAS</p>
</div>
</body>
</html>

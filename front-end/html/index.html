<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#0f2027,#ff4d4d,#0f2027);
            font-family: Arial, Helvetica, sans-serif;
        }

        #FalsoBoton{
            text-align:center;
            padding:40px 60px;
            font-size:40px;
            color:rgba(247, 10, 10, 0.571);
            background-color:#000000;
            border-radius:15px;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0px 10px 25px rgba(0,0,0,0.4);
        }

        #FalsoBoton:hover{
            background-color:#6b6868;
            transform:scale(1.05);
        }

        #FalsoBoton:active{
            transform:scale(0.98);
        }

    </style>
    
        <h1 style="text-align: center; margin-top: 20%;" id="FalsoBoton">
            Virtual PersonalGym
        </h1>
        
        <script>
            document.getElementById("FalsoBoton").addEventListener("click", function(){
                window.location.href = "menu.html";
            });
        </script> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/menu.css" rel="stylesheet">
</head>
<body class="text-white">
    <header>
        <nav class="navbar shadow-lg rounded fixed-top " style="background-color: #212723;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" >GYM</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                    <span class="bi bi-list text-secondary"></span>
                </button>
                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="ofcanvas-title" id="offcanvasNavbarlabel">Menu</h5>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item"><a href="#" class="nav-link">Profile</a></li>
                            <li class="nav-item"><a href="#" class="nav-link">settings</a></li>
                            <li class="nav-item"><a href="rutinas.html" class="nav-link">Rutines</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="d-flex justify-content-between align-items-center mt-5 p-3">
        <div>
            <h2>Analisis</h2>
            <p>dale seguimiento</p>
        </div>
        <button type="button" class="btn btn-success">Entrenamiento <i class="bi bi-activity"></i></button>

    </div>

    <section class="dashboard">
        
        
        <div class=" card kalorias shadow-lg p-3  rounded p-2 m-2">
            <h3 class="text-warning bi bi-fire">  Kalorias</h3>
            <div class="align-items-center py-5">
                <div class="progress bg-secondary bg-opacity-25" role="progressbar" aria-label="Basic example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar  bg-warning " style="width: 25%;"></div>
                </div>
            </div>
            
        </div>

        <div class="card ana-1 shadow-lg p-3 rounded p-2 m-2">
            <h3 class="bi bi-clipboard2 text-info">Análisis IA</h3>
        </div>

        <div class="card ana-2 shadow-lg p-3  rounded text-white p-2 m-2">
            <h3 class="bi bi-bar-chart-line pla-2"> Progreso Semanal</h3>
            <canvas class="p-5" id="myChart" width="400" height="200"></canvas>
        </div>

        <div class="card ana-3 shadow-lg p-3 rounded text-success p-2 m-2">
            <h3 class="bi bi-award-fill"> Metas</h3>
            <div class="h-100 d-flex flex-nowrap flex-column overflow-auto m-2 px-1" id="metaContent">

            </div>
        </div>

        <div class="card rutinas p-2 m-2 shadow-lg p-3  rounded">
            <h3 class="text-white-50 fw-bold"><i class="bi bi-calendar3-fill text-danger"></i> Plan de hoy</h3>
            <div class="d-flex flex-nowrap overflow-auto py-5 p-2 m-3" id="plans" style="scrollbar-width: thin;">
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/plan.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

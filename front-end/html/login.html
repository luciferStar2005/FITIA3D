<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loguin</title>
        <link rel="stylesheet" href="../css/loginStyle.css">
    </head>
    <body>
        <div class="container">
            <div class="left-panel">
                <h1>Gestiona tu <span class="highlight">GIMNASIO</span><br>de manera eficiente</h1>
            </div>

            <div class="right-panel">
                <div class="login-box">
                    <h2>Bienvenido</h2>
                    <button class="login-btn">Login</button>
                    <button class="signup-btn">Sign Up</button>
                </div>
            </div>
        </div>

        <div id="signup-modal" class="modal">
            <div class="modal-panel">
                <h2>Crear cuenta</h2>
                <form id="signup-form">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" required id="nombre">
                        <small id="nombre-msg">Ingresa tu nombre.</small>
                    </div>

                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" required id="apellido">
                        <small id="apellido-msg">Ingresa tu apellido.</small>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" required id="email">
                        <small id="email-msg">Debe ser un correo válido.</small>
                    </div>

                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" minlength="6" required id="password">
                        <small id="password-msg">Debe tener al menos 6 caracteres.</small>
                    </div>

                    <div class="modal-buttons">
                        <button type="submit" class="register-btn">Registrar</button>
                        <button type="button" id="back-btn" class="back-btn">Atrás</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="login-modal" class="modal">
            <div class="modal-panel">
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email">
                        <small id="login-email-msg">Ingresa tu correo</small>
                    </div>

                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="login-password">
                        <small id="login-password-msg">Ingresa tu contraseña</small>
                    </div>

                    <div class="modal-buttons">
                        <button type="submit" class="register-btn">Login</button>
                        <button type="button" id="login-back" class="back-btn">Atrás</button>
                    </div>
                </form>
            </div>
        </div>
        <script src="../javaScript/loginScript.js"></script>
    </body>
</html>
